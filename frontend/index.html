<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FullStack DevOps Project</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>FullStack DevOps Application</h1>

    <p>Frontend is running.</p>

    <button onclick="checkBackend()">
        Check Backend
    </button>

    <p id="result"></p>

    <hr>

    <h2>Task Manager</h2>

    <input
        type="text"
        id="taskTitle"
        placeholder="Task title"
    >

    <input
        type="text"
        id="taskDescription"
        placeholder="Task description"
    >

    <button onclick="createTask()">
        Add Task
    </button>

    <h3>Tasks</h3>

    <ul id="taskList"></ul>

    <script src="script.js"></script>

</body>
</html>
